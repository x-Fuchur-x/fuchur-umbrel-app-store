version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: fuchur-gameyfin_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/gameyfin/gameyfin:2.4.0
    restart: on-failure
    environment:
      APP_KEY: ${APP_GAMEYFIN_APP_KEY}
      PUID: 1000
      PGID: 1000
    volumes:
      - ${APP_DATA_DIR}/data/db:/opt/gameyfin/db:rw
      - ${APP_DATA_DIR}/data/data:/opt/gameyfin/data:rw
      - ${APP_DATA_DIR}/data/plugindata:/opt/gameyfin/plugindata:rw
      - ${APP_DATA_DIR}/data/logs:/opt/gameyfin/logs:rw
